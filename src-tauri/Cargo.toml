[package]
name = "readaity"
version = "0.4.1"
description = "A local, DRM-free ebook & comic reader"
authors = ["Anubis Productions"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "readaity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
unrar = "0.5"
walkdir = "2"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
md-5 = "0.10"
lopdf = "0.34"
regex = "1"

# --- Network sharing (b4): embedded HTTPS library server ---
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["net", "rt", "io-util", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["set-header", "limit"] }
rustls-pemfile = "2"
argon2 = "0.5"
local-ip-address = "0.6"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

